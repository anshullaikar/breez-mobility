# Local stack: postgres + redis + api + web client (+ optional simulation)
#   docker compose up --build
#   docker compose --profile simulation up --build   # also run the load simulation

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: breez
      POSTGRES_USER: breez
      POSTGRES_PASSWORD: breez
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breez"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://breez:breez@postgres:5432/breez
      REDIS_URL: redis://redis:6379
      JWT_SECRET: breez-poc-secret
      # development: OTP codes are returned in the API response (no WhatsApp yet)
      NODE_ENV: development
      PORT: 3000
      SEED_ON_START: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "5173:80"
    environment:
      API_UPSTREAM: http://app:3000
    depends_on:
      app:
        condition: service_healthy

  simulation:
    build: ./simulation
    environment:
      API_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
    profiles:
      - simulation

volumes:
  pgdata:
