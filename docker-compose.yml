services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: breez
      POSTGRES_USER: breez
      POSTGRES_PASSWORD: breez
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breez"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://breez:breez@postgres:5432/breez
      REDIS_URL: redis://redis:6379
      JWT_SECRET: breez-poc-secret
      NODE_ENV: development
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      app:
        condition: service_healthy

  simulation:
    build: .
    command: ["node", "simulation/run.js"]
    environment:
      API_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
    profiles:
      - simulation

volumes:
  pgdata: